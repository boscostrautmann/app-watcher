# jamf.conf - Configuration pour app_watcher.sh

# Paramètres Jamf
JAMF_URL="https://votreinstance.jamfcloud.com"
JAMF_CLIENT_ID="votre_client_id"
JAMF_CLIENT_SECRET="votre_client_secret"

# Paramètres de configuration générale
debug="false"              # true pour activer le mode debug
StartInterval=60           # Intervalle en secondes pour l'exécution du script
StandardOutPath="/var/log/app_watcher.log"    # Chemin pour les sorties standard
StandardErrorPath="/var/log/app_watcher.log"  # Chemin pour les erreurs
company="example"          # Nom de l'entreprise pour personnalisation
appsPlistPath="/etc/apps.plist"  # Chemin du fichier apps.plist

# Applications toujours autorisées (système ou Jamf)
system_apps="com.apple.finder com.apple.UnmountAssistantAgent com.apple.nbagent com.jamfsoftware.jamfHelper com.microsoft.CompanyPortalMac.ssoextension com.apple.SecurityAgent com.apple.studentd com.jamf.trust com.google.Chrome.helper.plugin com.google.Chrome.helper com.apple.AccessibilityVisualsAgent com.apple.WebKit.WebContent com.apple.WebKit.Networking com.apple.dock.helper com.apple.quicklook.ui.helper com.apple.OSDUIHelper com.apple.appkit.xpc.openAndSavePanelService com.jamf.remoteassist.connectorui com.apple.dock com.apple.wifi.WiFiAgent com.jamf.connect com.jamf.protect.agent com.apple.wallpaper.agent com.apple.dock.extra com.apple.dock.external.extra.arm64 com.apple.Spotlight com.apple.WebKit.GPU com.apple.loginwindow com.apple.systemuiserver com.apple.controlcenter com.apple.notificationcenter com.apple.uikitsystem com.apple.Terminal com.apple.CoreLocationAgent com.apple.AirPlayUIAgent com.apple.AppSSOAgent com.apple.backgroundtaskmanagement.agent com.apple.ReportCrash com.apple.Safari.SafeBrowsing.Service com.apple.SafariBookmarksSyncAgent com.apple.sharingd com.apple.tccd com.apple.TextInputMenuAgent com.apple.UserNotificationCenterAgent com.apple.XProtect.agent.scan com.apple.accessibility.AXVisualSupportAgent com.apple.Console com.apple.SoftwareUpdateNotificationManager com.apple.TextInputSwitcher com.apple.UIKitSystemApp com.apple.WindowManager com.apple.JamfAgent com.apple.SystemUIServer com.jamf.management.Jamf com.jamf.management.daemon com.jamf.management.JamfProCommService com.jamf.management.JamfProtectAgent com.jamf.management.trust com.jamf.management.connect com.jamf.management.remoteassist"